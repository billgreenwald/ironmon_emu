# XcodeGen spec — generates IronmonTracker.xcodeproj at build time (no checked-in .pbxproj).
# Regenerate locally/CI with:  xcodegen generate   (run from this iosApp/ directory)
#
# Prerequisites (both produced by CI before `xcodegen generate`):
#   1. libmgba:     ./scripts/build-libmgba.sh        -> build/libmgba/libmgba.xcframework
#   2. shared logic: (cd .. && ./gradlew :tracker-core:assembleTrackerCoreReleaseXCFramework)
#                    -> ../tracker-core/build/XCFrameworks/release/TrackerCore.xcframework
name: IronmonTracker
options:
  bundleIdPrefix: com.dnacollc.ironmon      # ← CHANGE to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    # CODE_SIGN_STYLE / DEVELOPMENT_TEAM are supplied by CI (or your local Xcode) — not hard-coded.

targets:
  IronmonTracker:
    type: application
    platform: iOS
    sources:
      - path: Sources/App          # SwiftUI + Metal shader + bridging header
      - path: Sources/Emulator     # EmulatorCore.{h,mm} (Obj-C++ over libmgba)
    # XcodeGen GENERATES this plist from `properties` (it overwrites any file at `path`), so every
    # key we need must live here — a hand-edited Sources/App/Info.plist is ignored. Missing
    # UILaunchStoryboardName is what made the app render letterboxed at the legacy 16:9 size.
    info:
      path: Sources/App/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnacollc.ironmon.tracker   # ← CHANGE to match your prefix
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/Bridging-Header.h
        # So the bridging header's `#import "EmulatorCore.h"` resolves.
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sources/Emulator"
    dependencies:
      # libmgba static core (headers expose <mgba/core/core.h> etc). Static → link, don't embed.
      - framework: build/libmgba/libmgba.xcframework
        embed: false
      # KMP shared logic (built static via isStatic=true → link, don't embed).
      - framework: ../tracker-core/build/XCFrameworks/release/TrackerCore.xcframework
        embed: false
      # System frameworks (Swift auto-links on import, listed for clarity/safety).
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
    # Bundled asset folders (blue folder references — preserve the path prefix the shared readers
    # expect: sprites/N.png|gif for PokemonSprite, maxdata/ for BundleAssetReader (MaxFR/NatDex),
    # maps/ for the Gallery overlay).
    resources:
      - path: ../app/src/main/assets/sprites
        type: folder
      - path: ../app/src/main/assets/maxdata
        type: folder
      - path: ../app/src/main/assets/maps
        type: folder
